html/custom_html_shell=""
html/head_include="<script>\n/* TRACE : débloque le son sur téléphone. Les navigateurs gardent l'audio coupé tant que la personne n'a pas touché la page ;\n   on relance TOUS les contextes audio créés par le jeu à chaque toucher / retour sur l'onglet. */\n(function(){\n  var C = window.AudioContext || window.webkitAudioContext; if (!C) return;\n  var all = [];\n  function W(){ var c = new (Function.prototype.bind.apply(C, [null].concat([].slice.call(arguments))))(); all.push(c); return c; }\n  W.prototype = C.prototype;\n  window.AudioContext = W; if (window.webkitAudioContext) window.webkitAudioContext = W;\n  function go(){ for (var i = 0; i < all.length; i++) { try { if (all[i].state !== 'running') all[i].resume(); } catch(e){} } }\n  ['touchstart','touchend','pointerdown','pointerup','mousedown','mouseup','click','keydown'].forEach(function(e){\n    document.addEventListener(e, go, {capture:true, passive:true});\n  });\n  document.addEventListener('visibilitychange', function(){ if (!document.hidden) go(); });\n  setInterval(go, 1500);\n})();\n</script>\n"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
